name: Python Extractor CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'python-service/**' # Só roda se houver mudança no código Python

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do Código
      uses: actions/checkout@v3

    - name: Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      working-directory: ./python-service
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Análise de Qualidade (Flake8)
      working-directory: ./python-service
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Disparar Deploy no Easypanel
      if: success()
      run: curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_PYTHON }}"